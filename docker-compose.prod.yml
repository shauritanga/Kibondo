# Production — nginx + php-fpm, optimized image, no dev seeding
# Usage: cp .env.docker.prod.example .env && docker compose -f docker-compose.prod.yml up --build -d
#
# Set APP_KEY and DB_PASSWORD before first deploy.

name: kibondo-prod

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-Kibondo Green Farm}
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
  APP_URL: ${APP_URL:-http://localhost}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-error}
  DB_CONNECTION: pgsql
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-kibondo_db}
  DB_USERNAME: ${DB_USERNAME:-kibondo}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_SSLMODE: ${DB_SSLMODE:-prefer}
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_SCHEME: ${MAIL_SCHEME:-}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Kibondo Green Farm}
  MAIL_CONTACT_TO: ${MAIL_CONTACT_TO:-info@kibondogreenfarm.co.tz}
  CONTACT_FORM_SECRET: ${CONTACT_FORM_SECRET:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-}
  RUN_MIGRATE: ${RUN_MIGRATE:-true}
  RUN_SEED: "false"
  SEED_DEV_ADMIN: "false"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod-worker
    environment:
      <<: *app-env
      RUN_MIGRATE: "false"
      RUN_OPTIMIZE: "false"
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=30
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod-worker
    environment:
      <<: *app-env
      RUN_MIGRATE: "false"
      RUN_OPTIMIZE: "false"
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
    command: php artisan schedule:work
    restart: unless-stopped

  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-kibondo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_DATABASE:-kibondo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-kibondo} -d ${DB_DATABASE:-kibondo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  storage:
  bootstrap-cache:
